name: windows_build_test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: GameTemplate.sln

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
    
      - name: Build
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $logfile = "BuildLog-${{ matrix.configuration }}-$timestamp.log"
          "LOGFILE=$logfile" >> $env:GITHUB_ENV

          
          Write-Host "Building solution with configuration: ${{ matrix.configuration }}"
          msbuild $env:SOLUTION_FILE_PATH /t:Clean /p:Platform=x64,Configuration=${{ matrix.configuration }}
          msbuild $env:SOLUTION_FILE_PATH /t:Build /p:Platform=x64,Configuration=${{ matrix.configuration }} | Tee-Object -FilePath $logfile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed. Check the log file: $logfile"
            exit $LASTEXITCODE
          }
      
      - name: Upload log to Discord
        if: failure() && github.event_name == 'pull_request'
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOKURL_LOGGER }}
        run: |
          pwsh --version
          if (-Not (Test-Path $env:LOGFILE)) {
            Write-Host "Log file not found. Exiting."
            exit 1
          }

          $payload = @{
            embeds = @(
              @{
                title = "Job Failed (${{ matrix.configuration }})"
                url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                color = 15548997

                author = @{
                  name = "GitHub Actions"
                  url = "https://github.com/n1m4-org/TD4_02-assumed-/actions"
                  icon_url = "https://drive.google.com/uc?id=1Qp-YcNpbMzaXENi8c7wvss6CzZ5-J4rG"
                }

                fields = @(
                  @{
                    name = "PR"
                    value = "[${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})"
                    inline = $false
                  },
                  @{
                    name = "Branch"
                    value = "${{ github.head_ref }}"
                    inline = $true
                  },
                  @{
                    name = "Author"
                    value = "${{ github.event.pull_request.user.login }}"
                    inline = $true
                  }
                )
              }
            )
          }

          $json = $payload | ConvertTo-Json -Depth 10 -Compress

          Write-Host "Sending payload to Discord webhook..."
          Invoke-RestMethod `
            -Uri $env:WEBHOOK `
            -Method Post `
            -ContentType "application/json" `
            -Body $json

          Write-Host "Uploading log file to Discord webhook..."
          curl.exe `
            -F "file1=@$env:LOGFILE" `
            $env:WEBHOOK

      - name: Discord Notification
        if: always() && github.event_name != 'pull_request'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
          status: ${{ job.status }}
          title: "GitHub Actions: GameTemplate ${{ matrix.configuration }}Build"

  filter-fix:
    needs: build
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run UpdateFilters
        shell: pwsh
        run: python UpdateFilters.py application/GameTemplate.vcxproj

      - name: Commit updated filters
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -- application/GameTemplate.vcxproj.filters
          if (git diff --cached --quiet) {
            Write-Host "No filter changes."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Visual Studio filters"
          git push origin "HEAD:$env:HEAD_REF"
          gh workflow run windows_build_test.yml --ref $env:HEAD_REF

      - name: Verify filters are up to date
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        shell: pwsh
        run: |
          git diff --exit-code -- application/GameTemplate.vcxproj.filters
          $diffExitCode = $LASTEXITCODE
          if ($diffExitCode -ne 0) {
            Write-Error "Filters are out of date and cannot be updated automatically for this run."
            exit $diffExitCode
          }

  notify-discord:
    needs:
      - build
      - filter-fix
    if: always() && github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Fail if validation did not succeed
        if: needs.build.result != 'success' || needs.filter-fix.result != 'success'
        shell: pwsh
        run: |
          Write-Host "Build result: '${{ needs.build.result }}'."
          Write-Host "Filter update result: '${{ needs.filter-fix.result }}'."
          exit 1

      - name: Notify Discord
        if: needs.build.result == 'success' && needs.filter-fix.result == 'success'
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOKURL_NOTIFY }}
          ADMIN_ROLE_ID: ${{ secrets.DISCORD_ADMIN_ROLE_ID }}
        run: |
          $payload = @{
            content = "<@&$env:ADMIN_ROLE_ID> Build test passed: ${{ github.event.pull_request.html_url }}"
            allowed_mentions = @{ parse = @("roles") }
          }

          $json = $payload | ConvertTo-Json -Depth 5 -Compress

          Invoke-RestMethod `
            -Uri $env:WEBHOOK `
            -Method Post `
            -ContentType "application/json" `
            -Body $json
