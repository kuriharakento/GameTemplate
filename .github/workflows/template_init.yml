name: template_init

# テンプレートから作られたリポジトリで、最初の push のときだけ
# "GameTemplate" という名前をリポジトリ名に置き換える。
on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  rename:
    # テンプレート本体では動かさない。初回の実行だけ対象にする。
    if: github.event.repository.name != 'GameTemplate' && github.run_number == 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename project
        # すでに置き換え済みなら何もしない
        if: hashFiles('GameTemplate.sln') != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          # C++ の識別子やプロジェクト名に使えない文字は _ にする
          NEW_NAME=$(echo "$REPO_NAME" | sed 's/[^A-Za-z0-9_]/_/g')
          if [[ "$NEW_NAME" =~ ^[0-9] ]]; then
            NEW_NAME="_${NEW_NAME}"
          fi
          echo "New project name: ${NEW_NAME}"

          # GITHUB_TOKEN ではワークフローのファイルを書き換えられないため .github は対象外にする。
          # engine サブモジュールも共通のものなので対象外。
          FILES=$(git grep -lI "GameTemplate" -- . ':!engine' ':!.github' || true)
          for f in $FILES; do
            # URL 内の owner/リポジトリ名は実際のものに置き換える
            sed -i "s|kuriharakento/GameTemplate|${REPO_FULL_NAME}|g" "$f"
            sed -i "s|GameTemplate|${NEW_NAME}|g" "$f"
          done

          # ファイル名を変更する
          git ls-files -- . ':!engine' ':!.github' | grep "GameTemplate" | while read -r f; do
            git mv "$f" "${f//GameTemplate/$NEW_NAME}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rename project from GameTemplate to ${NEW_NAME}"
          git push
